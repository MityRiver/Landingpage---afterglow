<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERGLOW</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>

<body>

<header class="cabecalho">
    <div class="barra-topo">

    <div class="titulo">
        <h1>AFTERGLOW</h1>
    </div>

    <div class="menu">
        <nav>
            <a href="#">Início</a>
            <a href="#">Line-up</a>
            <a href="#">Ingressos</a>
        </nav>
    </div>

</div>
</header>

<!-- banner -->

<div class="banner-container">
    <div class="banners">
        <img src="./imagens/1.jpg" alt="Banner 1">
        <img src="./imagens/2.jpg" alt="Banner 2">
        <img src="./imagens/3.jpg" alt="Banner 3">
        <img src="./imagens/4.jpg" alt="Banner 4">
        <img src="./imagens/5.jpg" alt="Banner 5">
        <img src="./imagens/5.jpg" alt="Banner 6">
        <img src="./imagens/6.jpg" alt="Banner 1">
    </div>
</div>

<!-- mapa -->

<div class="mapa">

    <div class="titulo-mapa">
        <h2>MAPA</h2>
    </div>

    <img src="./imagens/mapa.jpg" alt="Mapa do festival">
</div>

<!-- ingressos -->

<div class="titulo-ingressos">
    <h2>INGRESSOS</h2>
</div>

<!-- videos -->
<div class="videos">

<div class="ingresso">
    <video autoplay muted loop>
        <source src="./videos/1.mp4" type="video/mp4">
    </video>
    <h3>PISTA</h3>
    <h4>R$ 300,00</h4>
</div>

<div class="ingresso">
    <video autoplay muted loop>
        <source src="./videos/2.mp4" type="video/mp4">
    </video>
    <h3>ARENA</h3>
    <h4>R$ 375,00</h4>
</div>

<div class="ingresso">
    <video autoplay muted loop>
        <source src="./videos/3.mp4" type="video/mp4">
    </video>
    <h3>LOUGE</h3>
    <h4>R$ 500,00</h4>
</div>
</div>

<!-- RODAPÉ -->

<footer class="rodape">

    <div class="rodape-coluna">
        <h3>REDES SOCIAIS</h3>
        <p>@afterglow_festival</p>
    </div>

    <div class="rodape-coluna">
        <h3>SOBRE NÓS</h3>
        <a href="#">História</a>
        <a href="#">Patrocinadores</a>
    </div>

    <div class="rodape-coluna">
        <h3>CONTATO</h3>
        <p>Tel.: (16) 9 9999-9999</p>
        <p>Email: aflterglowfestival@gmail.com</p>
    </div>

    <div class="rodape-coluna">
        <h3>TRABALHE CONOSCO</h3>
        <a href="#">Envie seu currículo</a>
    </div>

</footer>

</body>
</html>
